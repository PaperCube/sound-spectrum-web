<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>声谱 · 实时音频分析</title>
<link rel="stylesheet" href="./styles/theme.css">
<link rel="stylesheet" href="./styles/app.css">
<script defer src="./scripts/state.js"></script>
<script defer src="./scripts/view.js"></script>
<script defer src="./scripts/multires.js"></script>
<script defer src="./scripts/audio.js"></script>
<script defer src="./scripts/charts.js"></script>
<script defer src="./scripts/settings-help.js"></script>
<script defer src="./scripts/chart-gestures.js"></script>
<script defer src="./scripts/controls.js"></script>
<script defer src="./scripts/app.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-stack" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></symbol>
  <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
  <symbol id="i-system" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v3m-4 0h8"/></symbol>
  <symbol id="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19m0-14-1.5 1.5m-11 11L5 19"/></symbol>
  <symbol id="i-dark" viewBox="0 0 24 24"><path d="M20.5 15.1A8.8 8.8 0 0 1 8.9 3.5 9 9 0 1 0 20.5 15.1Z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11v1a6.5 6.5 0 0 0 13 0v-1M12 18.5V22m-3 0h6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="var(--paper)"/><circle cx="16" cy="12" r="2" fill="var(--paper)"/><circle cx="10" cy="18" r="2" fill="var(--paper)"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h4l3-7 5 14 3-7h5"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2"/></symbol>
  <symbol id="i-level" viewBox="0 0 24 24"><path d="M5 19v-4m5 4V9m5 10V5m5 14v-8"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></symbol>
  <symbol id="i-water" viewBox="0 0 24 24"><path d="M3 5h18M3 10h18M3 15h18M3 20h18M8 5v5m7 0v5m-6 0v5"/></symbol>
</svg>
<header class="top">
  <div class="crumb">
    <svg class="icon" aria-hidden="true"><use href="#i-wave"/></svg>
    <span>声谱</span><span aria-hidden="true">/</span><h1>实时音频分析</h1>
  </div>
  <div class="top-actions">
    <div class="input-controls">
      <span class="status" id="status" role="status">麦克风未启用</span>
      <button class="button primary" id="mic-button"><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg><span>启用麦克风</span></button>
    </div>
    <div class="layout-controls" role="group" aria-label="图表排布">
      <button class="button icon-button" data-layout-choice="stack" title="上下排布" aria-label="上下排布" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-stack"/></svg></button>
      <button class="button icon-button" data-layout-choice="side" title="左右排布" aria-label="左右排布" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-side"/></svg></button>
    </div>
    <div class="theme-picker" id="theme-picker">
      <button class="button icon-button" id="theme-button" title="切换主题" aria-label="切换主题" aria-controls="theme-menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use id="theme-icon" href="#i-system"/></svg></button>
      <div class="theme-menu" id="theme-menu" role="group" aria-label="主题选项" hidden>
        <button type="button" data-theme-choice="system" aria-pressed="true">跟随系统</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">白天</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">晚上</button>
      </div>
    </div>
  </div>
</header>
<main id="overview" data-input="idle" data-layout="stack">
  <p id="notice" class="notice" role="alert" hidden></p>
  <aside class="metadata" aria-labelledby="metadata-title">
    <h2 id="metadata-title">分析信息</h2>
    <dl>
      <div><dt>采样率</dt><dd><output aria-live="off" id="sample-rate">—</output> kHz</dd></div>
      <div><dt>低频 FFT 分辨率</dt><dd><output aria-live="off" id="resolution">—</output> Hz</dd></div>
      <div><dt>基础 FFT 长度</dt><dd id="meta-fft"></dd></div>
      <div><dt>更新间隔</dt><dd id="meta-interval"></dd></div>
    </dl>
  </aside>
  <section class="instrument" aria-label="音频分析图">
    <section class="chart-card" id="spectrum-section" aria-labelledby="spectrum-title">
      <div class="panel-head">
        <div class="plot-title"><svg class="icon" aria-hidden="true"><use href="#i-wave"/></svg><h2 id="spectrum-title">实时频谱</h2></div>
        <button class="button chart-menu-toggle" type="button" popovertarget="spectrum-actions" aria-label="实时频谱选项" title="实时频谱选项"><span aria-hidden="true">⋮</span></button>
        <div class="chart-actions" id="spectrum-actions">
          <select id="spectrum-smoothing" aria-label="频谱曲线平滑" title="按倍频程范围平均相邻频点，范围越宽越平滑">
            <option value="0">平滑 · 关闭</option>
            <option value="48">平滑 · 1/48 倍频程</option>
            <option value="24" selected>平滑 · 1/24 倍频程</option>
            <option value="12">平滑 · 1/12 倍频程</option>
            <option value="6">平滑 · 1/6 倍频程</option>
            <option value="3">平滑 · 1/3 倍频程</option>
          </select>
          <button id="axis-button" class="button" aria-pressed="true" title="切换线性或对数频率轴">对数</button>
          <button id="hold-button" class="button" aria-pressed="true">峰值保持</button>
          <button id="pause-button" class="button" aria-pressed="false" disabled>冻结</button>
          <button id="fit-button" class="button" disabled>复位</button>
        </div>
      </div>
      <div id="spectrum-wrap" class="canvas-wrap">
        <canvas id="spectrum" tabindex="0" aria-label="频谱图，方向键移动游标，正负号缩放，Home 复位"></canvas>
        <div class="chart-cursor" id="spectrum-cursor" aria-hidden="true" hidden><span></span></div>
        <div class="empty-state" id="spectrum-empty"><span>启用麦克风以查看实时频谱</span></div>
      </div>
      <div class="plot-footer">
        <div class="legend"><span>实时</span><span id="hold-legend" class="held">保持</span></div>
        <span id="cursor-text">频率 Hz · 电平 dBFS</span>
      </div>
      <ol class="peak-list" id="peak-list" aria-label="频谱峰值" hidden></ol>
      <div class="chart-resize" id="spectrum-resize" role="separator" tabindex="0" aria-label="频谱图高度" aria-controls="spectrum-wrap" aria-orientation="horizontal" title="拖动调整高度，双击恢复自动高度"></div>
    </section>
    <div class="chart-resize" id="chart-splitter" role="separator" tabindex="0" aria-label="频谱和瀑布图的高度分配" aria-controls="spectrum-section water-section" aria-orientation="horizontal" title="拖动分配两张图的高度，双击恢复均分" hidden></div>
    <section class="chart-card" id="water-section" aria-labelledby="water-title">
      <div class="panel-head">
        <div class="plot-title"><svg class="icon" aria-hidden="true"><use href="#i-water"/></svg><h2 id="water-title">瀑布图</h2></div>
        <button class="button chart-menu-toggle" type="button" popovertarget="water-actions" aria-label="瀑布图选项" title="瀑布图选项"><span aria-hidden="true">⋮</span></button>
        <div class="water-controls" id="water-actions">
          <select id="water-time-scale" aria-label="瀑布图时间比例" title="时间比例（每秒占用的屏幕像素）">
            <option value="5">时间 · 5 px/s</option>
            <option value="10" selected>时间 · 10 px/s</option>
            <option value="20">时间 · 20 px/s</option>
            <option value="40">时间 · 40 px/s</option>
            <option value="80">时间 · 80 px/s</option>
          </select>
          <select id="water-quality" aria-label="瀑布图分辨率" title="瀑布图分辨率">
            <option value="very-low">极低分辨率</option>
            <option value="low">低分辨率</option>
            <option value="medium">中等分辨率</option>
            <option value="standard" selected>标准分辨率</option>
            <option value="high">高分辨率</option>
            <option value="very-high">超高分辨率</option>
            <option value="ultra">极高分辨率</option>
          </select>
          <div class="scale"><span id="scale-low">−100</span><span class="ramp"></span><span id="scale-high">0 dBFS</span></div>
        </div>
      </div>
      <div id="water-wrap" class="canvas-wrap">
        <canvas id="waterfall" aria-label="瀑布图，方向键移动游标，越靠上越新"></canvas>
        <div class="chart-cursor" id="water-cursor" aria-hidden="true" hidden><span></span></div>
        <div class="empty-state" id="water-empty"><span>等待音频输入</span></div>
      </div>
      <div class="water-history" id="water-history" hidden>
        <label for="water-history-position">历史位置</label>
        <input id="water-history-position" type="range" min="0" max="0" step="0.1" value="0" disabled>
        <output id="water-history-age" for="water-history-position">实时</output>
      </div>
      <div class="chart-resize" id="water-resize" role="separator" tabindex="0" aria-label="瀑布图高度" aria-controls="water-wrap" aria-orientation="horizontal" title="拖动调整高度，双击恢复自动高度"></div>
    </section>
  </section>
  <p class="help"><span>滚轮或双指缩放 · 拖动平移 · 双击复位 · 空格冻结</span><span>电平以数字满刻度 dBFS 表示</span></p>
</main>
<button class="button settings-launcher" id="settings-button" aria-label="分析设置" title="分析设置" aria-haspopup="dialog" aria-controls="settings-dialog"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span>分析设置</span></button>
<dialog id="settings-dialog" aria-labelledby="settings-title">
  <div class="dialog-head">
    <h2 id="settings-title">分析设置</h2>
    <form method="dialog"><button class="button" autofocus>完成</button></form>
  </div>
  <p id="settings-notice" class="notice" role="alert" hidden></p>
  <div class="settings">
    <fieldset>
      <legend>输入与 FFT</legend>
      <label>输入设备 <select id="input-device"><option value="">系统默认</option></select></label>
      <label>基础 FFT 长度 <select id="fft"><option>1024</option><option selected>2048</option><option>4096</option><option>8192</option><option>16384</option><option>32768</option></select></label>
      <label>低频分辨率 <select id="multires"><option value="true">增强（逐级降采样）</option><option value="false">标准（单 FFT）</option></select></label>
      <label>低频分段数量
        <select id="multires-bands">
          <option value="2">2 段</option><option value="3" selected>3 段</option><option value="4">4 段</option>
          <option value="5">5 段</option><option value="6">6 段</option>
        </select>
      </label>
      <label>时间平滑 <input id="smoothing" type="range" min="0" max="0.95" step="0.05" value="0.55"></label>
      <label>更新间隔 <select id="interval"><option value="24">24 ms</option><option value="32">32 ms</option><option value="48">48 ms</option><option value="64" selected>64 ms</option><option value="96">96 ms</option><option value="128">128 ms</option><option value="192">192 ms</option><option value="256">256 ms</option><option value="384">384 ms</option><option value="512">512 ms</option><option value="768">768 ms</option><option value="1000">1000 ms</option></select></label>
      <label class="check"><input id="remove-dc" type="checkbox" checked>移除直流分量</label>
      <div class="noise-controls">
        <label class="check"><input id="noise-filter" type="checkbox" disabled>过滤底噪</label>
        <button class="button" id="noise-calibrate" type="button" aria-describedby="noise-status" disabled>采集底噪</button>
        <output id="noise-status" aria-live="polite">请先启用麦克风</output>
      </div>
    </fieldset>
    <fieldset>
      <legend>峰值标注</legend>
      <label>峰值点数量 <select id="peak-count"><option value="0">关闭</option><option value="1">1 个</option><option value="2">2 个</option><option value="3">3 个</option><option value="4">4 个</option><option value="5">5 个</option><option value="6">6 个</option><option value="7">7 个</option><option value="8">8 个</option></select></label>
      <label>最低峰值电平 <select id="peak-floor"><option value="-140">−140 dBFS</option><option value="-120">−120 dBFS</option><option value="-100">−100 dBFS</option><option value="-80">−80 dBFS</option><option value="-60">−60 dBFS</option><option value="-40">−40 dBFS</option><option value="-20">−20 dBFS</option></select></label>
      <label>峰值最小间隔 <select id="peak-spacing"><option value="0">关闭</option><option value="24">1/24 倍频程</option><option value="12">1/12 倍频程</option><option value="6">1/6 倍频程</option><option value="3">1/3 倍频程</option></select></label>
      <label class="check"><input id="hold" type="checkbox">峰值保持</label>
    </fieldset>
    <fieldset>
      <legend>频谱</legend>
      <label>频谱高度（px） <input type="number" id="spectrum-height" min="160" max="900" step="1" placeholder="自动"></label>
      <label>频率轴 <select id="log"><option value="true">对数</option><option value="false">线性</option></select></label>
      <label>默认频段 <select id="frequency-range"><option value="full">全频段</option><option value="bass">低频 · 20–250 Hz</option><option value="voice">语音 · 100 Hz–4 kHz</option><option value="treble">高频 · 2–20 kHz</option></select></label>
      <label>显示下限 <select id="floor"><option value="-80">−80 dBFS</option><option value="-100" selected>−100 dBFS</option><option value="-120">−120 dBFS</option><option value="-140">−140 dBFS</option></select></label>
      <label class="check"><input id="spectrum-fill" type="checkbox" checked>填充频谱曲线下方</label>
    </fieldset>
    <fieldset>
      <legend>瀑布图</legend>
      <label>瀑布图高度（px） <input type="number" id="water-height" min="160" max="900" step="1" placeholder="自动"></label>
      <label>最低历史保留时长（秒） <input id="history" type="number" min="10" max="300" step="1" value="20" list="history-presets" title="10–300 秒"></label>
      <datalist id="history-presets">
        <option value="10"><option value="20"><option value="30"><option value="60">
        <option value="90"><option value="120"><option value="180"><option value="240"><option value="300">
      </datalist>
      <label>配色 <select id="water-palette"><option value="blue">蓝色</option><option value="heat">热力</option><option value="gray">灰阶</option></select></label>
      <label>颜色电平下限 <select id="water-floor"><option value="0">跟随频谱</option><option value="-140">−140 dBFS</option><option value="-120">−120 dBFS</option><option value="-100">−100 dBFS</option><option value="-80">−80 dBFS</option><option value="-60">−60 dBFS</option></select></label>
      <label class="check"><input id="show-water" type="checkbox" checked>显示瀑布图</label>
    </fieldset>
  </div>
  <div class="settings-footer">
    <button class="button" id="clear-button">清空瀑布图</button>
    <button class="button" id="clear-peak-button">重置峰值保持</button>
  </div>
  <div class="settings-tooltip" id="settings-tooltip" role="tooltip" hidden></div>
</dialog>
</body>
</html>
